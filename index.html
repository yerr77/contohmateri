      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const state = {

      search: "",

      notif: false,

      toast: "",

      agendaView: "Mendatang",
      oppKind: "Semua",
      savedTab: "Semua"

    let toastTimer = null;

    function notify(msg) {
      state.toast = msg;
      render();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = "";
        render();
      }, 2300);
    }

    function navigate(p) {
      state.page = p;
      state.mobile = false;
      state.notif = false;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleList(list, val, addedMsg, removedMsg) {
      const idx = list.indexOf(val);
      if (idx >= 0) {
        list.splice(idx, 1);
        if (removedMsg) notify(removedMsg);
      } else {
        list.push(val);
        if (addedMsg) notify(addedMsg);
      }
      render();
    }

    function renderPageHeader({ eyebrow, title, accent, desc, actionHtml = "" }) {
      return `
        <section class="page-header">
          <div>
            <p class="eyebrow">${eyebrow}</p>
            <h1>${title} <em>${accent}</em></h1>
            <p>${desc}</p>
          </div>
          ${actionHtml}
        </section>
      `;
    }

    function renderCommunityCard(item, idx) {
      const isJoined = state.joined.includes(item.name);
      return `
        <article class="community-card lift">
          <div class="community-card-top">
            <div class="community-logo" style="background: ${item.color}">${item.short}</div>
            <span>${item.cat}</span>
          </div>
          <h3>${item.name}</h3>
          <p>${item.desc}</p>
          <div class="member-row">
            <div>
              ${["1", "2", "3"].map((x) => `<img src="${avatar(item.short + x)}" alt="" />`).join("")}
            </div>
            <span>${item.members} anggota</span>
          </div>
          <button class="${isJoined ? "joined" : ""}" data-action="toggle-join" data-idx="${idx}">
            ${isJoined ? `${icon("check", 16)} Tergabung` : `${icon("plus", 16)} Gabung Komunitas`}
          </button>
        </article>
      `;
    }

    function renderEventCard(item, idx, isHomePreview = false) {
      const isReg = state.registered.includes(item.title);
      return `
        <article class="event-card lift">
          <div class="event-card-img">
            <img src="${item.image}" alt="${esc(item.title)}" />
            <span style="background: ${item.color}">${item.type}</span>
            <div>
              <b>${item.day}</b>
              <small>${item.month}</small>
            </div>
          </div>
          <div class="event-card-body">
            <h3>${item.title}</h3>
            <p>${icon("clock", 15)}${item.time}</p>
            <p>${icon("pin", 15)}${item.place}</p>
            <button
              class="${!isHomePreview && isReg ? "registered" : ""}"
              data-action="${isHomePreview ? "home-event-reg" : "toggle-register"}"
              data-idx="${idx}"
            >
              ${!isHomePreview && isReg ? `${icon("check", 16)} Terdaftar` : "Lihat & Daftar"}
            </button>
          </div>
        </article>
      `;
    }

    function renderEmpty({ iconName, title, text, hasAction = false }) {
      return `
        <div class="empty">
          <span>${icon(iconName, 28)}</span>
          <h3>${title}</h3>
          <p>${text}</p>
          ${hasAction ? `<button data-action="nav" data-page="Jelajahi">Mulai jelajahi ${icon("arrow", 15)}</button>` : ""}

            </article>
          </section>

          <div class="section-title">
            <div>

    function renderCommunitiesPage() {

      return `
        <div class="page-enter">
          ${renderPageHeader({
            eyebrow: "KOMUNITAS",
            title: "Temukan",
            accent: "lingkaranmu.",
            desc: "Bertemu orang-orang satu frekuensi, bertukar gagasan, dan tumbuh bersama.",
            actionHtml: `<button class="header-action" data-action="notify" data-msg="Form komunitas dibuka">${icon("plus", 17)} Buat Komunitas</button>`

            ${shown.map(({ item, idx }) => renderCommunityCard(item, idx)).join("")}

            <button class="${state.agendaView === "Selesai" ? "active" : ""}" data-action="set-agenda-view" data-val="Selesai">Selesai</button>
          </div>

          <div class="events-grid">
            ${shown.map(({ item, idx }) => renderEventCard(item, idx, false)).join("")}
          </div>

          ${
            state.agendaView === "Terdaftar" && state.registered.length === 0
              ? renderEmpty({
                  iconName: "calendar",
                  title: "Belum ada agenda terdaftar",
                  text: "Temukan agenda menarik dan mulai memperluas jejaringmu."
                })
              : ""
          }
        </div>
      `;
    }

    function renderOpportunitiesPage() {
      const kinds = ["Semua", "Magang", "Beasiswa", "Relawan", "Exchange"];
      const shown = opportunities
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => state.oppKind === "Semua" || item.kind === state.oppKind);

      return `
        <div class="page-enter">
          ${renderPageHeader({
            eyebrow: "PELUANG",
            title: "Langkah kecil menuju",
            accent: "masa depan.",
            desc: "Magang, beasiswa, kompetisi, dan kesempatan terbaik yang dikurasi untuk mahasiswa."
          })}

          <section class="opportunity-hero">
            <div>
              <span>PROGRAM UNGGULAN</span>
              <h2>Future Changemakers<br />Fellowship 2025</h2>
              <p>Program pengembangan pemimpin muda selama 6 bulan dengan mentor profesional.</p>
              <button data-action="notify" data-msg="Detail fellowship dibuka">
                Lihat program ${icon("arrow", 16)}
              </button>
            </div>
            <div class="orb">
              ${icon("award", 48)}
              <i></i>
              <i></i>
            </div>
          </section>

          <div class="filter-row">
            ${kinds
              .map(
                (x) =>
                  `<button class="${state.oppKind === x ? "active" : ""}" data-action="set-opp-kind" data-val="${x}">${x}</button>`
              )
              .join("")}
          </div>

          <div class="opportunity-layout">
            <div class="opportunity-list">
              ${shown
                .map(({ item, idx }) => {
                  const isSaved = state.savedOpp.includes(item.role);
                  return `
                    <article class="opportunity-row lift">
                      <div class="opp-logo" style="background: ${item.color}">${item.logo}</div>
                      <div>
                        <span>${item.kind}</span>
                        <h3>${item.role}</h3>
                        <p>${item.org} · ${item.location}</p>
                      </div>
                      <div class="deadline">
                        <small>Ditutup</small>
                        <b>${item.deadline}</b>
                      </div>
                      <button class="${isSaved ? "saved" : ""}" data-action="toggle-save-opp" data-idx="${idx}">
                        ${icon("bookmark", 18)}
                      </button>
                    </article>
                  `;
                })
                .join("")}
            </div>

            <aside class="career-card">
              <span>${icon("spark", 21)}</span>
              <h3>Career Match</h3>
              <p>Jawab 5 pertanyaan dan temukan peluang yang paling cocok untukmu.</p>
              <div><i style="width: 72%"></i></div>
              <small>Profil karier 72% lengkap</small>
              <button data-action="notify" data-msg="Career Match dimulai">Lanjutkan asesmen</button>
            </aside>
          </div>
        </div>
      `;
    }

    function renderSavedPage() {
      const tabs = ["Semua", "Diskusi", "Artikel", "Agenda", "Peluang"];
      const showDiskusi = state.saved && (state.savedTab === "Semua" || state.savedTab === "Diskusi");
      const showPeluang = state.savedTab === "Semua" || state.savedTab === "Peluang";
      const visibleOpp = showPeluang ? state.savedOpp : [];
      const totalShown = (showDiskusi ? 1 : 0) + visibleOpp.length;

      return `
        <div class="page-enter">
          ${renderPageHeader({
            eyebrow: "KOLEKSI PRIBADI",
            title: "Semua yang ingin kamu",
            accent: "ingat.",
            desc: "Kumpulan diskusi, agenda, artikel, dan peluang yang kamu simpan."
          })}

          <div class="filter-row">
            ${tabs
              .map(
                (x) =>
                  `<button class="${state.savedTab === x ? "active" : ""}" data-action="set-saved-tab" data-val="${x}">${x}</button>`
              )
              .join("")}
          </div>

          ${
            totalShown === 0
              ? renderEmpty({
                  iconName: "bookmark",
                  title: "Koleksimu masih kosong",
                  text: "Simpan hal menarik dari halaman lain agar mudah ditemukan kembali.",
                  hasAction: true
                })
              : `
                <div class="saved-grid">
                  ${
                    showDiskusi
                      ? `
                        <article class="saved-card lift">
                          <span class="saved-type">DISKUSI</span>
                          <div class="saved-author">
                            <img src="${avatar("nabila")}" alt="" />
                            <p>
                              <b>Nabila Putri</b>
                              <small>ITB · 22 menit lalu</small>
                            </p>
                          </div>
                          <h3>Program kecil apa yang paling berdampak untuk kampus berkelanjutan?</h3>
                          <button data-action="unsave-post" title="Hapus dari tersimpan">
                            ${icon("bookmark", 18)}
                          </button>
                        </article>
                      `
                      : ""
                  }
                  ${visibleOpp
                    .map((role) => {
                      const idx = opportunities.findIndex((o) => o.role === role);
                      const x = opportunities[idx];
                      if (!x) return "";
                      return `
                        <article class="saved-card lift">
                          <span class="saved-type green">${x.kind}</span>
                          <div class="saved-company">
                            <div style="background: ${x.color}">${x.logo}</div>
                            <p>
                              <b>${x.org}</b>
                              <small>${x.location}</small>
                            </p>
                          </div>
                          <h3>${x.role}</h3>
                          <button data-action="toggle-save-opp" data-idx="${idx}" title="Hapus dari tersimpan">
                            ${icon("bookmark", 18)}
                          </button>
                        </article>
                      `;
                    })
                    .join("")}
                </div>
              `
          }
        </div>
      `;
    }

    function renderProfilePage() {
      const skills = ["Community Building", "Public Speaking", "Content Strategy", "Leadership"];
      const activities = [
        { text: "Membagikan diskusi di Kampus Berkelanjutan", icon: "message" },
        { text: "Mengikuti Design Leadership Talk", icon: "calendar" },
        { text: "Bergabung dengan GDSC Indonesia", icon: "users" }
      ];

      return `
        <div class="page-enter">
          <section class="profile-cover">
            <img src="${photos.students}" alt="Kehidupan kampus" />
            <button data-action="notify" data-msg="Pengubah sampul dibuka">
              ${icon("image", 16)} Ubah sampul
            </button>
          </section>

          <section class="profile-head">
            <div class="profile-avatar">
              <img src="${avatar("KEPIN")}" alt="KEPIN" />
              <i></i>
            </div>
            <div>
              <h1>KEPIN <span>${icon("check", 12)}</span></h1>
              <p>Mahasiswa TEKNIK INFORMATIKA · Universitas Kristen Satya Wacana</p>
              <div>
                <span>${icon("pin", 14)} Salatiga, Indonesia</span>
                <span>182 koneksi</span>
              </div>
            </div>
            <button data-action="notify" data-msg="Editor profil dibuka">
              ${icon("edit", 16)} Edit Profil
            </button>
          </section>

          <div class="profile-layout">
            <div>
              <section class="profile-section">
                <div class="section-title compact">
                  <div>
                    <p>TENTANG</p>
                    <h2>Cerita singkat</h2>
                  </div>
                  <button data-action="notify" data-msg="Edit deskripsi singkat">${icon("edit", 15)}</button>
                </div>
                <p class="bio">
                  Tertarik pada komunikasi, pengembangan komunitas, dan inovasi sosial. Saat ini aktif
                  membangun ruang kolaborasi untuk mahasiswa di seluruh Indonesia.
                </p>
                <div class="skill-list">
                  ${skills.map((x) => `<span>${x}</span>`).join("")}
                </div>
              </section>

              <section class="profile-section">
                <div class="section-title compact">
                  <div>
                    <p>AKTIVITAS</p>
                    <h2>Kontribusi terbaru</h2>
                  </div>
                </div>
                ${activities
                  .map(
                    (a, i) => `
                    <div class="activity">
                      <span>${icon(a.icon, 17)}</span>
                      <div>
                        <strong>${a.text}</strong>
                        <small>${i + 1} hari lalu</small>
                      </div>
                    </div>
                  `
                  )
                  .join("")}
              </section>
            </div>

            <aside>
              <section class="profile-section profile-score">
                <div class="score-ring">
                  <div>
                    <strong>82</strong>
                    <small>%</small>
                  </div>
                </div>
                <h3>Profilmu hampir lengkap</h3>
                <p>Tambahkan portofolio untuk meningkatkan visibilitas.</p>
                <button data-action="notify" data-msg="Form portofolio dibuka">Tambah portofolio</button>
              </section>

              <section class="profile-section">
                <div class="section-title compact">
                  <div>
                    <p>PENCAPAIAN</p>
                    <h2>Lencana</h2>
                  </div>
                </div>
                <div class="badges">
                  <div>${icon("award")}<span>Kolaborator</span></div>
                  <div>${icon("spark")}<span>Penggerak</span></div>
                  <div>${icon("book")}<span>Pembelajar</span></div>
                </div>
              </section>
            </aside>
          </div>
        </div>
      `;
    }

    function renderCurrentPage() {
      switch (state.page) {
        case "Jelajahi":
          return renderExplorePage();
        case "Komunitas":
          return renderCommunitiesPage();
        case "Agenda":
          return renderAgendaPage();
        case "Peluang":
          return renderOpportunitiesPage();
        case "Tersimpan":
          return renderSavedPage();
        case "Profil":
          return renderProfilePage();
        default:
          return renderHomePage();
      }
    }

    function render() {
      const activeEl = document.activeElement;
      const focusedId = activeEl ? activeEl.id : null;
      const selStart = activeEl && typeof activeEl.selectionStart === "number" ? activeEl.selectionStart : null;

      const root = document.getElementById("app");
      root.innerHTML = `
        <aside class="sidebar ${state.mobile ? "open" : ""}">
          <div class="brand">
            <div class="brand-mark">n</div>
            <div>
              <strong>Wifi Tetangga</strong>
              <small>RUANG MAHASISWA</small>
            </div>
          </div>
          <button class="mobile-close" data-action="close-mobile" aria-label="Tutup menu">
            ${icon("x")}
          </button>
          <nav>
            <p>MENU UTAMA</p>
            ${navItems
              .map(
                (x) => `
                <button class="${state.page === x.label ? "active" : ""}" data-action="nav" data-page="${x.label}">
                  ${icon(x.icon, 19)}
                  <span>${x.label}</span>
                  ${x.label === "Agenda" ? `<b>${state.registered.length || 3}</b>` : ""}
                </button>
              `
              )
              .join("")}
          </nav>

          <div class="sidebar-promo">
            <span>${icon("spark", 19)}</span>
            <strong>Punya komunitas?</strong>
            <p>Bangun ruang kolaborasi untuk mahasiswa se-Indonesia.</p>
            <button data-action="nav" data-page="Komunitas">
              Mulai sekarang ${icon("arrow", 14)}
            </button>
          </div>

          <button class="sidebar-user" data-action="nav" data-page="Profil">
            <img src="${avatar("KEPIN")}" alt="KEPIN" />
            <div>
              <strong>KEPIN</strong>
              <small>Universitas Kristen Satya Wacana</small>
            </div>
            ${icon("more", 17)}
          </button>
        </aside>

        ${state.mobile ? `<button class="screen-backdrop" data-action="close-mobile" aria-label="Tutup"></button>` : ""}

        <main class="main">
          <header class="topbar">
            <button class="menu-button" data-action="open-mobile" aria-label="Buka menu">
              ${icon("menu")}
            </button>

            <div class="search-box">
              ${icon("search", 18)}
              <input
                id="search-input"
                type="text"
                value="${esc(state.search)}"
                placeholder="Cari komunitas, agenda, atau peluang..."
              />
              ${
                state.search
                  ? `<button data-action="clear-search" aria-label="Hapus pencarian">${icon("x", 15)}</button>`
                  : ""
              }
              <kbd>⌘ K</kbd>
            </div>

            <div class="top-actions">
              <div class="notification-wrap">
                <button class="icon-button" data-action="toggle-notif" aria-label="Notifikasi">
                  ${icon("bell")}
                  <i></i>
                </button>
                ${
                  state.notif
                    ? `
                      <div class="notification-panel">
                        <div>
                          <strong>Notifikasi</strong>
                          <button data-action="close-notif">Tutup</button>
                        </div>
                        <article>
                          <span class="purple"></span>
                          <p>
                            <b>Dinda membalas diskusimu</b>
                            <small>5 menit lalu</small>
                          </p>
                        </article>
                        <article>
                          <span class="green"></span>
                          <p>
                            <b>Pendaftaran acara berhasil</b>
                            <small>1 jam lalu</small>
                          </p>
                        </article>
                        <article>
                          <span class="coral"></span>
                          <p>
                            <b>3 peluang baru untukmu</b>
                            <small>Hari ini</small>
                          </p>
                        </article>
                      </div>
                    `
                    : ""
                }
              </div>

              <button class="primary-button" data-action="open-composer">
                ${icon("plus", 17)}
                <span>Buat Diskusi</span>
              </button>
            </div>
          </header>

          <div class="content">
            ${
              state.search
                ? `
                  <div class="search-notice">
                    ${icon("search", 16)} Menampilkan hasil untuk <b>“${esc(state.search)}”</b>
                    <button data-action="clear-search">Hapus</button>
                  </div>
                `
                : ""
            }
            ${renderCurrentPage()}
            <footer>
              <span>© 2025 Wifi Tetangga</span>
              <div>
                <a href="#tentang" data-action="notify" data-msg="Halaman Tentang">Tentang</a>
                <a href="#panduan" data-action="notify" data-msg="Halaman Panduan">Panduan</a>
                <a href="#privasi" data-action="notify" data-msg="Kebijakan Privasi">Privasi</a>
                <a href="#bantuan" data-action="notify" data-msg="Pusat Bantuan">Bantuan</a>
              </div>
            </footer>
          </div>
        </main>

        ${
          state.composer
            ? `
              <div class="modal">
                <button class="modal-bg" data-action="close-composer" aria-label="Tutup modal"></button>
                <div class="composer">
                  <div class="composer-head">
                    <div>
                      <p>RUANG DISKUSI</p>
                      <h2>Mulai percakapan baru</h2>
                    </div>
                    <button data-action="close-composer" aria-label="Tutup">${icon("x")}</button>
                  </div>
                  <div class="composer-user">
                    <img src="${avatar("KEPIN")}" alt="" />
                    <p>
                      <b>KEPIN</b>
                      <small>Posting ke komunitas umum</small>
                    </p>
                    ${icon("chevron", 16)}
                  </div>
                  <textarea
                    id="composer-textarea"
                    placeholder="Bagikan ide, pertanyaan, atau kabar baikmu..."
                  >${esc(state.post)}</textarea>
                  <div class="composer-foot">
                    <button data-action="notify" data-msg="Pemilih gambar dibuka">
                      ${icon("image", 18)} Tambah gambar
                    </button>
                    <button id="publish-btn" data-action="publish-post" ${!state.post.trim() ? "disabled" : ""}>
                      Terbitkan ${icon("send", 15)}
                    </button>
                  </div>
                </div>
              </div>
            `
            : ""
        }

        ${
          state.toast
            ? `
              <div class="toast">
                ${icon("check", 17)}
                ${esc(state.toast)}
              </div>
            `
            : ""
        }
      `;

      if (focusedId) {
        const el = document.getElementById(focusedId);
        if (el) {
          el.focus();
          if (selStart !== null && typeof el.setSelectionRange === "function") {
            el.setSelectionRange(selStart, selStart);
          }
        }
      }
    }

    document.addEventListener("click", (e) => {
      const target = e.target.closest("[data-action]");
      if (!target) return;
      e.preventDefault();

      const action = target.dataset.action;
      switch (action) {
        case "nav":
          navigate(target.dataset.page);
          break;
        case "open-mobile":
          state.mobile = true;
          render();
          break;
        case "close-mobile":
          state.mobile = false;
          render();
          break;
        case "toggle-notif":
          state.notif = !state.notif;
          render();
          break;
        case "close-notif":
          state.notif = false;
          render();
          break;
        case "open-composer":
          state.composer = true;
          render();
          setTimeout(() => {
            const ta = document.getElementById("composer-textarea");
            if (ta) ta.focus();
          }, 10);
          break;
        case "close-composer":
          state.composer = false;
          render();
          break;
        case "publish-post":
          if (state.post.trim()) {
            state.composer = false;
            state.post = "";
            notify("Diskusi berhasil diterbitkan");
          }
          break;
        case "clear-search":
          state.search = "";
          render();
          break;
        case "toggle-like":
          state.liked = !state.liked;
          render();
          break;
        case "home-event-reg":
          notify("Pendaftaran acara dibuka");
          break;
        case "toggle-join": {
          const item = communityData[Number(target.dataset.idx)];
          if (item) {
            toggleList(
              state.joined,
              item.name,
              `Bergabung dengan ${item.name}`,
              `Keluar dari ${item.name}`
            );
          }
          break;
        }
        case "toggle-register": {
          const item = events[Number(target.dataset.idx)];
          if (item) {
            toggleList(
              state.registered,
              item.title,
              `Terdaftar di ${item.title}`,
              `Pendaftaran ${item.title} dibatalkan`
            );
          }
          break;
        }
        case "toggle-save-opp": {
          const item = opportunities[Number(target.dataset.idx)];
          if (item) {
            toggleList(
              state.savedOpp,
              item.role,
              `${item.role} disimpan`,
              `${item.role} dihapus dari tersimpan`
            );
          }
          break;
        }
        case "unsave-post":
          state.saved = false;
          notify("Diskusi dihapus dari tersimpan");
          break;
        case "set-explore-topic":
          state.exploreTopic = target.dataset.val;
          render();
          break;
        case "set-community-cat":
          state.communityCat = target.dataset.val;
          render();
          break;
        case "set-agenda-view":
          state.agendaView = target.dataset.val;
          render();
          break;
        case "set-opp-kind":
          state.oppKind = target.dataset.val;
          render();
          break;
        case "set-saved-tab":
          state.savedTab = target.dataset.val;
          render();
          break;
        case "notify":
          notify(target.dataset.msg || "Aksi dijalankan");
          break;
      }
    });

    document.addEventListener("input", (e) => {
      if (e.target.id === "search-input") {
        state.search = e.target.value;
        render();
      } else if (e.target.id === "composer-textarea") {
        state.post = e.target.value;
        const btn = document.getElementById("publish-btn");
        if (btn) btn.disabled = !state.post.trim();
      }
    });

    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        const input = document.getElementById("search-input");
        if (input) input.focus();
      } else if (e.key === "Escape") {
        if (state.composer || state.notif || state.mobile) {
          state.composer = false;
          state.notif = false;
          state.mobile = false;
          render();
        }
      }
    });

    render();
  </script>
</body>
</html>
